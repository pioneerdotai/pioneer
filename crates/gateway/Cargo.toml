[package]
name = "pioneer-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Compile only deterministic native OAuth audit fixtures.
oauth-test-support = ["pioneer-mcp-oauth/test-support"]
default = []

[dependencies]
cua-driver-sdk = { git = "https://github.com/trycua/cua", rev = "688c5fd62a9f13dddc309970c948df494e7de33f" }
pioneer-compaction.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
pioneer-agent.workspace = true
pioneer-artifacts.workspace = true
pioneer-cli-agent-runtime.workspace = true
pioneer-cli-mcp-bridge.workspace = true
pioneer-config.workspace = true
pioneer-crud.workspace = true
pioneer-hooks.workspace = true
pioneer-keystore.workspace = true
pioneer-migration.workspace = true
pioneer-mcp.workspace = true
pioneer-mcp-oauth.workspace = true
pioneer-memory.workspace = true
pioneer-observability.workspace = true
pioneer-entity.workspace = true
pioneer-protocol.workspace = true
pioneer-provider.workspace = true
pioneer-promt.workspace = true
pioneer-runtime-events.workspace = true
pioneer-tunnel.workspace = true
pioneer-skills.workspace = true
pioneer-sqlite.workspace = true
pioneer-tasks.workspace = true
pioneer-tools.workspace = true
tokio.workspace = true
tokio-util.workspace = true
notify.workspace = true
same-file.workspace = true
async-stream.workspace = true
futures-util.workspace = true
keepawake.workspace = true
libc.workspace = true
process-wrap.workspace = true
log.workspace = true
memvid-core.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
reqwest.workspace = true
markdown.workspace = true
chrono.workspace = true
schemars.workspace = true
mime_guess.workspace = true
url.workspace = true
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tiktoken-rs.workspace = true
tokenizers.workspace = true
flate2.workspace = true
tar.workspace = true
sha2.workspace = true
zstd.workspace = true
subtle.workspace = true
hex.workspace = true
hmac.workspace = true
# Confidential stateless read cursors must not disclose filtered candidate IDs.
ring = "0.17.14"
image.workspace = true
fs4.workspace = true
transcribe-rs.workspace = true
uuid.workspace = true
zeroize.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[build-dependencies]
pioneer-protocol.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
sentry = { workspace = true, features = ["test"] }
pioneer-sqlite = { workspace = true, features = ["test-support"] }
pioneer-client.workspace = true
pioneer-client-ffi.workspace = true
pioneer-crud = { workspace = true, features = ["test-support"] }
pioneer-mcp-oauth = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
