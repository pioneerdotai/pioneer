[package]
name = "pioneer-client-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
qualification-diagnostics = ["pioneer-observability/qualification-diagnostics"]
schema = ["dep:schemars", "pioneer-client/schema"]

[[bin]]
name = "schema"
path = "src/bin/schema.rs"
required-features = ["schema"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
pioneer-client.workspace = true
pioneer-observability.workspace = true
pioneer-protocol.workspace = true
rustls.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
zeroize.workspace = true
