[package]
name = "pioneer-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Application-owned, bounded diagnostics for an approved non-production runner.
qualification-diagnostics = ["pioneer-observability/qualification-diagnostics"]

[[bin]]
name = "pioneer-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pioneer-config.workspace = true
pioneer-client.workspace = true
pioneer-keystore.workspace = true
pioneer-observability.workspace = true
pioneer-protocol.workspace = true
pioneer-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
toml.workspace = true
zeroize.workspace = true
terminal.workspace = true
gpui-kit = { workspace = true, features = ["component", "assets"] }
rust-i18n.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
chrono.workspace = true
sys-locale.workspace = true
rust-embed.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
image.workspace = true
cpal.workspace = true
syntect.workspace = true
two-face.workspace = true
unicode-width.workspace = true
webbrowser.workspace = true
url.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
hex.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

[package.metadata.i18n]
available-locales = ["en", "ru", "zh", "hi", "es", "de", "fr", "jp"]
default-locale = "en"
load-path = "locales"
