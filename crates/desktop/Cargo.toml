[package]
name = "pioneer-desktop"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Application-owned, bounded diagnostics for an approved non-production runner.
qualification-diagnostics = ["pioneer-observability/qualification-diagnostics"]

[[bin]]
name = "pioneer-app"
path = "src/main.rs"

[dependencies]
pioneer-desktop-thread.workspace = true
pioneer-desktop-administration.workspace = true
pioneer-desktop-providers.workspace = true
pioneer-desktop-mcp.workspace = true
pioneer-desktop-skills.workspace = true
pioneer-desktop-agents-doc.workspace = true
pioneer-desktop-settings.workspace = true
pioneer-desktop-onboarding.workspace = true
pioneer-desktop-workspaces.workspace = true
pioneer-desktop-update.workspace = true
pioneer-desktop-task-notifications.workspace = true
anyhow.workspace = true
base64.workspace = true
tracing.workspace = true
pioneer-config.workspace = true
pioneer-client.workspace = true
pioneer-desktop-foundation.workspace = true
pioneer-keystore.workspace = true
pioneer-observability.workspace = true
pioneer-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
zeroize.workspace = true
terminal.workspace = true
gpui-kit = { workspace = true, features = ["component", "assets"] }
rust-i18n.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
sys-locale.workspace = true
rust-embed.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
image.workspace = true
cpal.workspace = true
webbrowser.workspace = true
url.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Syntax-aware ownership and Render checks use the already locked parser.
syn = { version = "=2.0.119", features = ["full", "visit"] }
gpui-kit = { workspace = true, features = ["test-support"] }
hex.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

[package.metadata.i18n]
available-locales = ["en", "ru", "zh", "hi", "es", "de", "fr", "jp"]
default-locale = "en"
load-path = "locales"
