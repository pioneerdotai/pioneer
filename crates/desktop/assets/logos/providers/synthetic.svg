<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="18" fill="#0F172A"/>
  <!-- Neural net node pattern -->
  <circle cx="50" cy="50" r="8" fill="#22D3EE"/>
  <circle cx="25" cy="30" r="5" fill="#0E7490" opacity="0.9"/>
  <circle cx="75" cy="30" r="5" fill="#0E7490" opacity="0.9"/>
  <circle cx="25" cy="70" r="5" fill="#0E7490" opacity="0.9"/>
  <circle cx="75" cy="70" r="5" fill="#0E7490" opacity="0.9"/>
  <!-- connections -->
  <line x1="50" y1="50" x2="25" y2="30" stroke="#164E63" stroke-width="2"/>
  <line x1="50" y1="50" x2="75" y2="30" stroke="#164E63" stroke-width="2"/>
  <line x1="50" y1="50" x2="25" y2="70" stroke="#164E63" stroke-width="2"/>
  <line x1="50" y1="50" x2="75" y2="70" stroke="#164E63" stroke-width="2"/>
  <line x1="25" y1="30" x2="75" y2="30" stroke="#164E63" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="70" x2="75" y2="70" stroke="#164E63" stroke-width="1.5" opacity="0.6"/>
</svg>