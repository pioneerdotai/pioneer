<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="astGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a1e"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#astGrad)"/>
  <!-- Star / asterisk shape -->
  <g transform="translate(50,50)">
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- small stars -->
  <circle cx="20" cy="20" r="2" fill="white" opacity="0.7"/>
  <circle cx="78" cy="24" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="84" cy="72" r="2" fill="white" opacity="0.5"/>
</svg>