# Handwritten architecture contract. Changes to owners, edges or unit kinds
# require architecture review; this is not an inventory generated from source.
version = 1
platforms = ["desktop", "ios", "android"]
ui_cases = [
 "access.revoked.fail_closed", "administration.invitations", "administration.members",
 "agents_doc.editor", "composer.attachments", "composer.capabilities.skills", "composer.default",
 "composer.mode.permission", "composer.model.reasoning", "composer.voice", "gateway.setup.initial",
 "gateway.switcher.menu", "invitation.join.flow", "layout.extremes", "mcp.details", "mcp.list",
 "providers.catalog", "providers.model_selector", "session.connectivity", "settings.account.devices",
 "settings.account.profile", "settings.general", "settings.memory", "settings.self_improvement",
 "shell.launch.loading", "shell.navigation.default", "shell.overlay.dialog", "shell.overlay.notification",
 "sidebar.thread_tree.empty", "sidebar.thread_tree.populated", "skills.details", "skills.list",
 "task.notifications", "thread.empty", "thread.header", "thread.side_panel.artifacts",
 "thread.side_panel.members", "timeline.long.virtualized", "timeline.markdown.rich",
 "timeline.message.actions", "timeline.pending.approval", "timeline.row.mutation",
 "timeline.running.indicators", "timeline.static.mixed", "timeline.streaming.agent",
 "timeline.task.work", "workspace.selector"
]
# No optional scene cache has accepted external benefit evidence.
scene_caches = []
custom_elements = ["desktop-thread/src/timeline/markdown.rs:MarkdownLinkText"]
foundation_modules = ["avatar", "binding", "identity"]
foundation_sources = ["avatar.rs", "binding.rs", "identity.rs", "lib.rs"]
# Framework creates this transient host through on_drag's Entity<W: Render> API.
# Its value preview has no retained UI behavior or cache.
framework_hosts = ["desktop-workspaces/src/drag_preview.rs:SidebarDragSession"]

