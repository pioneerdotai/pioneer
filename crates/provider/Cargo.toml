[package]
name = "pioneer-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
pioneer-protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
async-trait.workspace = true
futures-util.workspace = true
reqwest.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
url.workspace = true
mime_guess.workspace = true
tempfile.workspace = true
image.workspace = true
tiktoken-rs.workspace = true
lopdf = { version = "0.45", default-features = false }
symphonia = { version = "0.6", default-features = false, features = ["all"] }
mp4parse = "0.17"

[dev-dependencies]
# Independent signing oracle; never part of production auth/credential flow.
aws-sigv4 = { version = "=1.6.0", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = { version = "=1.3.0", features = ["hardcoded-credentials"] }
tokio = { workspace = true, features = ["test-util"] }
flate2.workspace = true
tracing-subscriber.workspace = true
