[package]
name = "pioneer-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Qualification-only local capture. Ordinary builds compile call-site
# recording out; an approved non-production runner must opt in explicitly.
qualification-diagnostics = ["dep:serde", "dep:serde_json"]

[dependencies]
anyhow.workspace = true
dotenvy.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sentry.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
