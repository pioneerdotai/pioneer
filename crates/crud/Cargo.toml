[package]
name = "pioneer-crud"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
test-support = ["pioneer-crud-memory/test-support", "pioneer-crud-artifacts/test-support", "pioneer-crud-compaction/test-support", "pioneer-crud-tasks/test-support"]

[dependencies]
zstd.workspace = true
tokio-util.workspace = true
pioneer-compaction.workspace = true
pioneer-crud-access.workspace = true
pioneer-crud-artifacts.workspace = true
pioneer-crud-compaction.workspace = true
pioneer-crud-conversations.workspace = true
pioneer-crud-execution.workspace = true
pioneer-crud-memory.workspace = true
pioneer-crud-packages.workspace = true
pioneer-crud-payloads.workspace = true
pioneer-crud-self-improvement.workspace = true
pioneer-crud-tasks.workspace = true
pioneer-crud-timeline.workspace = true
anyhow.workspace = true
futures-util.workspace = true
pioneer-entity.workspace = true
pioneer-hooks.workspace = true
pioneer-observability.workspace = true
pioneer-protocol.workspace = true
pioneer-apps.workspace = true
pioneer-packages.workspace = true
pioneer-postgres-pools.workspace = true
sea-orm = { workspace = true, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde_json.workspace = true
serde.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex.workspace = true
sha2.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
pioneer-crud-timeline = { workspace = true, features = ["test-support"] }
pioneer-crud-artifacts = { workspace = true, features = ["test-support"] }
pioneer-crud-execution = { workspace = true, features = ["test-support"] }
pioneer-crud-conversations = { workspace = true, features = ["test-support"] }
pioneer-crud-compaction = { workspace = true, features = ["test-support"] }
pioneer-crud-memory = { workspace = true, features = ["test-support"] }
pioneer-postgres-pools = { workspace = true, features = ["test-support"] }
pioneer-crud-tasks = { workspace = true, features = ["test-support"] }
pioneer-crud-access = { workspace = true, features = ["test-support"] }
pioneer-postgres-test.workspace = true
tempfile.workspace = true
pioneer-migration.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
