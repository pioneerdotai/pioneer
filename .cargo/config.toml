[env]
BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_darwin = "--target=arm64-apple-darwin"
# Composed observability/startup debug futures need the same bounded stack as
# the large Gateway fixture runner. Production runtime sizing is unchanged.
# Explicit Builder::stack_size calls, including the 2 MiB canary, still override this.
RUST_MIN_STACK = { value = "33554432", force = true }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"
incremental = false
