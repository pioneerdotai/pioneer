[workspace]
resolver = "3"
members = [
  "crates/agent",
  "crates/artifacts",
  "crates/promt",
  "crates/config",
  "crates/keystore",
  "crates/gateway",
  "crates/hooks",
  "crates/desktop",
  "crates/cli",
  "crates/crud",
  "crates/entity",
  "crates/migration",
  "crates/mcp",
  "crates/memory",
  "crates/protocol",
  "crates/provider",
  "crates/skills",
  "crates/sqlite",
  "crates/tasks",
  "crates/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Pioneer Contributors"]

[workspace.dependencies]
# Local
pioneer-agent = { path = "crates/agent" }
pioneer-artifacts = { path = "crates/artifacts" }
pioneer-keystore = { path = "crates/keystore" }
pioneer-gateway = { path = "crates/gateway" }
pioneer-hooks = { path = "crates/hooks" }
pioneer-config = { path = "crates/config" }
pioneer-desktop = { path = "crates/desktop" }
pioneer-cli = { path = "crates/cli" }
pioneer-crud = { path = "crates/crud" }
pioneer-entity = { path = "crates/entity" }
pioneer-migration = { path = "crates/migration" }
pioneer-mcp = { path = "crates/mcp" }
pioneer-memory = { path = "crates/memory" }
pioneer-protocol = { path = "crates/protocol" }
pioneer-provider = { path = "crates/provider" }
pioneer-skills = { path = "crates/skills" }
pioneer-tasks = { path = "crates/tasks" }
pioneer-tools = { path = "crates/tools" }
pioneer-sqlite = { path = "crates/sqlite" }
pioneer-promt = { path = "crates/promt" }

# Error handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1"
schemars = { version = "1.2", features = ["derive"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Async
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["full"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3" }

# UI
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
gpui-terminal = "0.1.0"
markdown = "1"

# Tokenization
tiktoken-rs = "0.11"

# Utils
nanoid = "0.5"
futures-util = "0.3"
futures-timer = "3"
async-trait = "0.1"
tokio-stream = "0.1"
config = "0.15"
dirs = "6"
rand = "0.10"
webclaw-core = { git = "https://github.com/0xMassi/webclaw", package = "webclaw-core", default-features = false }
scraper = "0.26"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
enigo = "0.6.1"
xcap = "0.9.4"
tempfile = "3"

# Agent memory capsule store
memvid-core = { version = "2.0", default-features = false, features = ["lex", "temporal_track", "simd"] }

# Embed
rust-embed = "8"

# Locale
rust-i18n = "4"
sys-locale = "0.3"

# HTTP
reqwest = { version = "0.13", features = ["json", "query", "stream", "multipart", "blocking"] }
http = "1"

# Crypto
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
url = "2"
libc = "0.2"
mime_guess = "2"
flate2 = "1"
tar = "0.4"
windows-sys = "0.61"

# Database
sea-orm = "2.0.0-rc.38"
sea-orm-migration = "2.0.0-rc.38"

# MCP
rmcp = { version = "1.6.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
process-wrap = { version = "9.1.0", features = ["tokio1"] }
