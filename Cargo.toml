[workspace]
resolver = "3"
members = [
  "crates/agent",
  "crates/artifacts",
  "crates/client",
  "crates/client-ffi",
  "crates/cli-agent-runtime",
  "crates/cli-mcp-bridge",
  "crates/promt",
  "crates/config",
  "crates/keystore",
  "crates/gateway",
  "crates/hooks",
  "crates/observability",
  "crates/desktop",
  "crates/desktop-updater",
  "crates/cli",
  "crates/crud",
  "crates/entity",
  "crates/migration",
  "crates/mcp",
  "crates/memory",
  "crates/protocol",
  "crates/provider",
  "crates/runtime-events",
  "crates/tunnel",
  "crates/skills",
  "crates/sqlite",
  "crates/tasks",
  "crates/tools",
  "crates/terminal",
]

[workspace.package]
version = "0.47.0"
edition = "2024"
license = "MIT"
authors = ["Pioneer Contributors"]

[workspace.dependencies]
# Local
pioneer-agent = { path = "crates/agent" }
pioneer-artifacts = { path = "crates/artifacts" }
pioneer-client = { path = "crates/client" }
pioneer-client-ffi = { path = "crates/client-ffi" }
pioneer-cli-agent-runtime = { path = "crates/cli-agent-runtime" }
pioneer-cli-mcp-bridge = { path = "crates/cli-mcp-bridge" }
pioneer-keystore = { path = "crates/keystore" }
pioneer-gateway = { path = "crates/gateway" }
pioneer-hooks = { path = "crates/hooks" }
pioneer-observability = { path = "crates/observability" }
pioneer-config = { path = "crates/config" }
pioneer-desktop = { path = "crates/desktop" }
pioneer-app-updater = { path = "crates/desktop-updater" }
pioneer-cli = { path = "crates/cli" }
pioneer-crud = { path = "crates/crud" }
pioneer-entity = { path = "crates/entity" }
pioneer-migration = { path = "crates/migration" }
pioneer-mcp = { path = "crates/mcp" }
pioneer-memory = { path = "crates/memory" }
pioneer-protocol = { path = "crates/protocol" }
pioneer-provider = { path = "crates/provider" }
pioneer-runtime-events = { path = "crates/runtime-events" }
pioneer-tunnel = { path = "crates/tunnel" }
pioneer-skills = { path = "crates/skills" }
pioneer-tasks = { path = "crates/tasks" }
pioneer-tools = { path = "crates/tools" }
pioneer-sqlite = { path = "crates/sqlite" }
pioneer-promt = { path = "crates/promt" }

# Error handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
toml = "1.1"
schemars = { version = "1.2", features = ["derive"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
uuid = "1.24"

# Async
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Tracing
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
sentry = { version = "0.48", default-features = false, features = ["anyhow", "backtrace", "contexts", "panic", "transport", "tracing"] }
dotenvy = "0.15"
opentelemetry = { version = "0.32", default-features = false, features = ["internal-logs", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["internal-logs", "metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["internal-logs", "metrics", "trace", "http-proto", "reqwest-blocking-client"] }

# UI
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component-assets" }
terminal = { path = "crates/terminal" }
markdown = "1"

# Tokenization
tiktoken-rs = "0.12"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-onig", "dump-load"] }
two-face = { version = "=0.5.1", default-features = false, features = ["syntect-onig"] }
unicode-width = "=0.2.2"
webbrowser = { version = "1.2.4", features = ["hardened"] }

# Utils
nanoid = "0.5"
futures-util = "0.3"
futures-timer = "3"
async-trait = "0.1"
tokio-stream = "0.1"
config = "0.15"
dirs = "6"
rand = "0.10"
webclaw-core = { git = "https://github.com/0xMassi/webclaw", package = "webclaw-core", default-features = false }
nono = { git = "https://github.com/nolabs-ai/nono", tag = "v0.66.0", default-features = false }
scraper = "0.27"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
xcap = "0.9"
xa11y = "0.11"
tempfile = "3"
fs4 = "1.1"
lazy_static = "1.5"
lru_time_cache = "0.11"
owning_ref = "0.4"
names = { version = "0.14", default-features = false }
pretty_assertions = "1"
shell-words = "1.1"
keepawake = "0.6"
cpal = "0.18"
transcribe-rs = { version = "0.3.11", features = ["onnx", "whisper-cpp"] }

# Agent memory capsule store
memvid-core = { git = "https://github.com/pioneerdotai/memory", tag = "v3.1.2", default-features = false, features = ["lex", "temporal_track", "simd", "vec"] }

# Embed
rust-embed = "8"

# Locale
rust-i18n = "4"
sys-locale = "0.3"

# HTTP
reqwest = { version = "0.13", features = ["json", "query", "stream", "multipart", "blocking", "socks", "gzip"] }
bytes = "1"
http = "1"
rathole = { git = "https://github.com/pioneerdotai/relay.git", default-features = false, features = ["client"] }

# Crypto
hmac = "0.13"
sha2 = "0.11"
zeroize = "1"
subtle = "2.6"
hex = "0.4"
icu_collator = "2.2.1"
base64 = "0.22"
url = "2"
libc = "0.2"
mime_guess = "2"
image = "0.25"
qrcode = { version = "0.14", default-features = false }
flate2 = "1"
tar = "0.4"
windows-sys = "0.61"

# Database
sea-orm = "2.0.0-rc.43"
sea-orm-migration = "2.0.0-rc.43"
rusqlite = { version = "0.39", default-features = false, features = ["functions", "blob", "bundled", "array"] }
zstd = { version = "0.13", features = ["experimental"] }

# MCP
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
process-wrap = { version = "9.1.0", features = ["tokio1"] }
