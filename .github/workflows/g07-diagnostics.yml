name: G07 diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-build:
    name: ci-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_tests: "true"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.target }}

      - name: rustfmt-check
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check

      - name: install-linux-build-dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev
          multiarch="$(gcc -print-multiarch)"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/${multiarch}" >> "${GITHUB_ENV}"

      - name: focused-gateway-regressions
        shell: bash
        run: |
          set -uo pipefail
          result=0
          for filter in followup_history detached_composer_work_matches same_websocket_terminal_decision_after_durable_put; do
            timeout 240s cargo test --locked -p pioneer-gateway "$filter" -- --nocapture || result=1
          done
          exit "$result"
