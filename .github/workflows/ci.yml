name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test-build:
    name: ci-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # apple-metal (through the pinned CUA SDK) uses macOS 26.2 SDK APIs.
      - name: select-cua-xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.target }}

      - name: cargo-check-workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace

  linux-build:
    name: ci-ubuntu-latest-x86_64-unknown-linux-gnu-build
    runs-on: ubuntu-latest
    # Compile once for all shards; keep doctests on the same build/dependency tree.
    timeout-minutes: 180
    outputs:
      archive-id: ${{ steps.upload-tests.outputs.artifact-id }}
    env: &linux-env
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_BUILD_JOBS: 2

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - &linux-toolchain
        name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - &linux-build-profile
        name: configure-linux-build-profile
        shell: bash
        run: |
          echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"

      - name: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-x86_64-unknown-linux-gnu-no-debug-v1

      - name: rustfmt-check
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check

      - &linux-dependencies
        name: install-linux-build-dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Keep the runner's official Ubuntu fallbacks; its Azure mirror stalled CI.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y \
            pkg-config \
            libasound2-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev
          multiarch="$(gcc -print-multiarch)"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/${multiarch}" >> "${GITHUB_ENV}"

      - &install-nextest
        name: install-nextest
        shell: bash
        run: |
          set -euo pipefail
          # Official pre-built binary; use the same version to archive and run.
          curl -LsSf https://get.nexte.st/0.9.149/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: archive-workspace-tests
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest archive --locked --workspace \
            --archive-file "$RUNNER_TEMP/nextest-tests.tar.zst"

      - name: upload-workspace-tests
        id: upload-tests
        uses: actions/upload-artifact@v4
        with:
          name: linux-nextest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nextest-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: cargo-test-doctests
        if: ${{ !cancelled() && (steps.archive.outcome == 'success' || steps.archive.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace --doc

  linux-tests:
    name: ci-ubuntu-latest-x86_64-unknown-linux-gnu-shard-${{ matrix.shard }}
    needs: linux-build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: *linux-env
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - *linux-toolchain
      - *linux-build-profile
      - *linux-dependencies
      - *install-nextest

      - name: require-workspace-test-archive
        env:
          ARCHIVE_ID: ${{ needs.linux-build.outputs.archive-id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_ID"

      # The producing job's artifact ID also works when only failed shards are rerun.
      - name: download-workspace-tests
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.linux-build.outputs.archive-id }}
          path: ${{ runner.temp }}/nextest
          merge-multiple: true

      - name: cargo-nextest-workspace
        shell: bash
        run: |
          set -euo pipefail
          # Keep target/ at its original path for compile-time paths in tests.
          # Build options, including --locked --workspace, are stored in the archive.
          cargo nextest run --archive-file "$RUNNER_TEMP/nextest/nextest-tests.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
            --partition hash:${{ matrix.shard }}/4 \
            --test-threads 2 --no-fail-fast --retries 0 \
            --status-level pass --final-status-level fail --failure-output immediate-final

  linux-result:
    # Preserve the Linux check name used by branch protection.
    name: ci-ubuntu-latest-x86_64-unknown-linux-gnu
    needs: [linux-build, linux-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require-all-linux-checks
        env:
          BUILD_RESULT: ${{ needs.linux-build.result }}
          LINUX_RESULT: ${{ needs.linux-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          # Require the build, rustfmt, doctests, archive upload and all four shards.
          echo "Linux build and doctests: ${BUILD_RESULT}"
          echo "Linux checks: ${LINUX_RESULT}"
          test "${BUILD_RESULT}" = success
          test "${LINUX_RESULT}" = success
