name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test-build:
    name: ci-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.target }}

      - name: cargo-check-workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace

  linux-tests:
    name: ci-ubuntu-latest-x86_64-unknown-linux-gnu-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Include cold workspace compilation; do not extend the original timeout.
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: configure-linux-build-profile
        shell: bash
        run: |
          echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"

      - name: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-x86_64-unknown-linux-gnu-no-debug-v1

      - name: rustfmt-check
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check

      - name: install-linux-build-dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Keep the runner's official Ubuntu fallbacks; its Azure mirror stalled CI.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y \
            pkg-config \
            libasound2-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev
          multiarch="$(gcc -print-multiarch)"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/${multiarch}" >> "${GITHUB_ENV}"

      - name: install-nextest
        shell: bash
        run: |
          set -euo pipefail
          # Official pre-built binary; pin the same version on every shard.
          curl -LsSf https://get.nexte.st/0.9.149/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: cargo-nextest-workspace
        id: nextest
        shell: bash
        run: |
          set -euo pipefail
          # Tests may create multithreaded Tokio runtimes: start with two at once.
          cargo nextest run --locked --workspace --partition hash:${{ matrix.shard }}/4 \
            --test-threads 2 --no-fail-fast --retries 0 \
            --status-level pass --final-status-level fail --failure-output immediate-final

      - name: cargo-test-doctests
        if: ${{ !cancelled() && matrix.shard == 1 && (steps.nextest.outcome == 'success' || steps.nextest.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace --doc

  linux-result:
    # Preserve the Linux check name used by branch protection.
    name: ci-ubuntu-latest-x86_64-unknown-linux-gnu
    needs: linux-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require-all-linux-checks
        env:
          LINUX_RESULT: ${{ needs.linux-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          # The matrix includes all four shards, rustfmt and the single doctest run.
          echo "Linux checks: ${LINUX_RESULT}"
          test "${LINUX_RESULT}" = success
