name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

# Keep only the latest run for each PR/branch; other refs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-build:
    name: ci-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.target }}

      - name: cargo-check-workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace

  linux-tests:
    name: ci-ubuntu-latest-x86_64-unknown-linux-gnu-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Include cold workspace compilation; do not extend the original timeout.
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: setup-rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, llvm-tools-preview

      - name: configure-linux-build-profile
        shell: bash
        run: |
          echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"

      - name: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-x86_64-unknown-linux-gnu-coverage-v1-rust-1.99.1
          workspaces: . -> target/coverage

      - name: rustfmt-check
        id: fmt
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check

      - name: install-linux-build-dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Keep the runner's official Ubuntu fallbacks; its Azure mirror stalled CI.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y \
            pkg-config \
            libasound2-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev
          multiarch="$(gcc -print-multiarch)"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/${multiarch}" >> "${GITHUB_ENV}"

      - name: install-nextest
        shell: bash
        run: |
          set -euo pipefail
          # Official pre-built binary; pin the same version on every shard.
          curl -LsSf https://get.nexte.st/0.9.149/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: install-coverage-tools
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz \
            | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install-coverage-parser
        run: |
          python -m pip install --only-binary=:all: -r scripts/coverage/requirements.txt

      - name: prepare-coverage
        shell: bash
        run: |
          set -euo pipefail
          # Restore instrumented dependencies, then clear workspace artifacts and old profiles.
          cargo llvm-cov clean --locked --workspace
          rm -rf coverage-shard target/coverage-nextest
          mkdir coverage-shard
          rustc --print cfg --target x86_64-unknown-linux-gnu > coverage-shard/target-cfg.txt

      - name: cargo-nextest-workspace
        id: nextest
        shell: bash
        run: |
          set -euo pipefail
          # Tests may create multithreaded Tokio runtimes: start with two at once.
          cargo llvm-cov nextest --locked --workspace --no-report --no-cfg-coverage \
            --profile coverage --partition hash:${{ matrix.shard }}/4 \
            --test-threads 2 --no-fail-fast --retries 0 \
            --status-level pass --final-status-level fail --failure-output immediate-final \
            --cargo-message-format json-render-diagnostics > coverage-shard/build.jsonl

      - name: cargo-test-doctests
        id: doctests
        if: ${{ !cancelled() && matrix.shard == 1 && (steps.nextest.outcome == 'success' || steps.nextest.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace --doc

      - name: export-coverage-shard
        env:
          COVERAGE_NEXTEST_RESULT: ${{ steps.nextest.outcome }}
          COVERAGE_FMT_RESULT: ${{ steps.fmt.outcome }}
          COVERAGE_DOCTESTS_RESULT: ${{ steps.doctests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov report --locked --lcov --no-default-ignore-filename-regex \
            --output-path coverage-shard/raw.lcov
          python scripts/coverage/coverage.py pack --shard ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: coverage-shard/
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: ci-linux-production-coverage
    needs: linux-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install-coverage-parser
        run: |
          python -m pip install --only-binary=:all: -r scripts/coverage/requirements.txt

      # Exact names bind downloads to this run AND attempt. A missing shard is fatal.
      - uses: actions/download-artifact@v4
        with:
          name: coverage-shard-${{ github.run_id }}-${{ github.run_attempt }}-1
          path: coverage-input/shard-1

      - uses: actions/download-artifact@v4
        with:
          name: coverage-shard-${{ github.run_id }}-${{ github.run_attempt }}-2
          path: coverage-input/shard-2

      - uses: actions/download-artifact@v4
        with:
          name: coverage-shard-${{ github.run_id }}-${{ github.run_attempt }}-3
          path: coverage-input/shard-3

      - uses: actions/download-artifact@v4
        with:
          name: coverage-shard-${{ github.run_id }}-${{ github.run_attempt }}-4
          path: coverage-input/shard-4

      - name: merge-production-coverage
        env:
          COVERAGE_LINUX_RESULT: ${{ needs.linux-tests.result }}
        run: python scripts/coverage/coverage.py merge --input coverage-input

      - name: upload-production-coverage
        uses: actions/upload-artifact@v4
        with:
          name: linux-production-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage-report/
          if-no-files-found: error
          retention-days: 90

      - name: publish-coverage-summary
        shell: bash
        run: cat coverage-report/summary.md >> "$GITHUB_STEP_SUMMARY"

  linux-result:
    # Preserve the Linux check name used by branch protection.
    name: ci-ubuntu-latest-x86_64-unknown-linux-gnu
    needs: [linux-tests, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require-all-linux-checks
        env:
          LINUX_RESULT: ${{ needs.linux-tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        shell: bash
        run: |
          set -euo pipefail
          # The matrix includes all four shards, rustfmt and the single doctest run.
          echo "Linux checks: ${LINUX_RESULT}"
          echo "Coverage: ${COVERAGE_RESULT}"
          test "${LINUX_RESULT}" = success
          test "${COVERAGE_RESULT}" = success
