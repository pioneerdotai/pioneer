name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test-build:
    name: ci-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_tests: "true"
            # Include cold workspace compilation and the complete test suite.
            timeout_minutes: 180
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: "false"
            timeout_minutes: 120
          - os: macos-14
            target: aarch64-apple-darwin
            run_tests: "false"
            timeout_minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.target }}

      - name: rustfmt-check
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check

      - name: install-linux-build-dependencies
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Keep the runner's official Ubuntu fallbacks; its Azure mirror stalled CI.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y \
            pkg-config \
            libasound2-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev
          multiarch="$(gcc -print-multiarch)"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/${multiarch}" >> "${GITHUB_ENV}"

      - name: cargo-check-workspace
        if: matrix.run_tests != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace

      - name: cargo-test-pr-regressions
        if: matrix.run_tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pioneer-gateway --lib failed_snapshot_update_keeps_live_roots_and_root_failure_is_isolated -- --nocapture
          cargo test --locked -p pioneer-gateway --lib cli_native_terminal_consumer_acks_delivery_and_retains_ownership_after_publisher_cancel -- --nocapture
          cargo test --locked -p pioneer-gateway --lib refill_confirmed_prefix_survives_poison_and_unknown_commit_without_replay -- --nocapture
          cargo test --locked -p pioneer-gateway --lib thread_episodic -- --nocapture

      - name: cargo-test-workspace
        if: matrix.run_tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -- --nocapture
