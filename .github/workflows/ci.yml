name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test-build:
    name: ci-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_tests: "true"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: "false"
          - os: macos-14
            target: aarch64-apple-darwin
            run_tests: "false"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: rustfmt-check
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check

      - name: install-linux-build-dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev
          multiarch="$(gcc -print-multiarch)"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/${multiarch}" >> "${GITHUB_ENV}"

      - name: cargo-check-workspace
        if: matrix.run_tests != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace

      - name: cargo-test-workspace
        if: matrix.run_tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked
