name: Build Debug Symbols
run-name: Debug symbols (release run ${{ inputs.source_run_id }})

# Publication does not wait for this independent workflow. Never rebuild a
# release executable here: consume the original producer's link inputs.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact Release run that retained the inputs (legacy producers are also supported)
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SENTRY_DISABLE_UPDATE_CHECK: "true"

jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      has_macos: ${{ steps.select.outputs.has_macos }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
    steps:
      - uses: actions/github-script@v8
        id: select
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const id = process.env.SOURCE_RUN_ID;
            if (!/^[0-9]+$/.test(id)) throw new Error('Invalid source run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: Number(id)});
            const producers = {'.github/workflows/release.yml': ['desktop', 'gateway'],
                               '.github/workflows/release-app.yml': ['desktop'],
                               '.github/workflows/release-gateway.yml': ['gateway']};
            const products = producers[run.path.split('@')[0]];
            if (run.head_repository.id !== context.payload.repository.id || !/^[0-9a-f]{40}$/.test(run.head_sha) ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                !products) {
              throw new Error('Select a trusted release producer from this repository');
            }
            core.setOutput('source_sha', run.head_sha);
            core.setOutput('source_run_id', String(run.id));
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100});
            const platforms = {
              'x86_64-unknown-linux-gnu': 'ubuntu-latest',
              'aarch64-unknown-linux-gnu': 'ubuntu-24.04-arm',
              'x86_64-apple-darwin': 'macos-latest',
              'aarch64-apple-darwin': 'macos-latest',
              'x86_64-pc-windows-msvc': 'windows-latest',
              'aarch64-pc-windows-msvc': 'windows-11-arm',
            };
            const include = [];
            for (const artifact of artifacts) {
              const match = /^symbol-inputs-(desktop|gateway)-(.+?)(?:-(default|computer-use))?$/.exec(artifact.name);
              if (!match || artifact.expired || !platforms[match[2]]) continue;
              if (!products.includes(match[1])) throw new Error('Unexpected input producer');
              include.push({artifact_id: artifact.id, name: artifact.name,
                            target: match[2], os: platforms[match[2]], variant: match[3] || ''});
            }
            core.setOutput('matrix', JSON.stringify({include}));
            core.setOutput('count', include.length);
            core.setOutput('has_macos', include.some(row => row.os.startsWith('macos')));
            // Variant Gateway producers emit both variants. Select one complete
            // generation for this trusted run; mixed/incomplete inventories are rejected.
            const variantGateway = include.some(row => row.variant);
            const expected = Object.keys(platforms).flatMap(target => products.flatMap(product =>
              product === 'gateway' && variantGateway
                ? ['default', 'computer-use'].map(variant => `symbol-inputs-gateway-${target}-${variant}`)
                : [`symbol-inputs-${product}-${target}`]));
            const names = new Set(include.map(row => row.name));
            if (expected.some(name => !names.has(name))) throw new Error('Missing release symbol inputs');
            if (include.length !== expected.length || names.size !== expected.length ||
                include.some(row => !expected.includes(row.name))) {
              throw new Error('Mixed or duplicate release symbol input generations');
            }

  macos-tool:
    name: build-dsymutil
    needs: inputs
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    if: needs.inputs.outputs.has_macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.inputs.outputs.source_sha }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pioneer-dsymutil
          key: dsymutil-${{ runner.os }}-${{ runner.arch }}-5e8490a1-${{ hashFiles('scripts/packaging/dsymutil-undefined-symbols.patch') }}
      - name: build-pinned-dsymutil
        shell: bash
        run: python3 scripts/packaging/run-symbol-job.py bash scripts/packaging/build-dsymutil.sh "$RUNNER_TEMP/pioneer-dsymutil"
      - uses: actions/upload-artifact@v6
        with:
          name: debug-symbols-macos-tool
          path: ${{ runner.temp }}/pioneer-dsymutil/
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  symbols:
    name: symbols-${{ matrix.name }}
    needs: [inputs, macos-tool]
    permissions:
      contents: read
      actions: read
    if: >-
      always() && !cancelled() && needs.inputs.result == 'success' && needs.inputs.outputs.count != '0'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inputs.outputs.matrix) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SENTRY_DISABLE_UPDATE_CHECK: "true"
      SYMBOL_SOURCE_SHA: ${{ needs.inputs.outputs.source_sha }}
      SYMBOL_SOURCE_RUN_ID: ${{ needs.inputs.outputs.source_run_id }}
      SYMBOL_TARGET: ${{ matrix.target }}
      SYMBOL_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.inputs.outputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: download-exact-release-inputs
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ matrix.artifact_id }}
          run-id: ${{ needs.inputs.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: symbol-inputs
          merge-multiple: true
      - name: download-pinned-dsymutil
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v7
        with:
          name: debug-symbols-macos-tool
          path: symbol-tool
      - name: generate-and-verify-debug-symbols
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            chmod +x symbol-tool/dsymutil
            export DSYMUTIL="$PWD/symbol-tool/dsymutil"
          fi
          python scripts/packaging/run-symbol-job.py python scripts/packaging/symbol-inputs.py process symbol-inputs symbol-work symbols
          if [[ -f symbol-tool/tool.json ]]; then cp symbol-tool/tool.json symbols/dsymutil-tool.json; fi
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: install-pinned-sentry-cli
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @sentry/cli@3.8.2
          sentry_cli="$(node -e 'process.stdout.write(require(process.argv[1]).SentryCli.getPath())' "$(npm root -g)/@sentry/cli")"
          export SENTRY_CLI_EXECUTABLE="$sentry_cli"
          echo "SENTRY_CLI_EXECUTABLE=$sentry_cli" >> "$GITHUB_ENV"
          # Exercise the same native invocation as source bundling, including Windows.
          python -c 'import os, subprocess; subprocess.run([os.environ["SENTRY_CLI_EXECUTABLE"], "--version"], check=True)'
      # Prepare source context offline, even before Sentry credentials exist.
      # Use the exact producer checkout; keep bundles in the private artifact.
      - name: bundle-sources-for-sentry
        shell: bash
        run: |
          python scripts/packaging/run-symbol-job.py python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          manifests = sorted(Path('symbols').glob('*/manifest.json'))
          if not manifests:
              raise SystemExit('No verified symbol manifests found')
          for manifest in manifests:
              metadata = json.loads(manifest.read_text())
              files = [manifest.parent / item['filename'] for item in metadata['files']]
              native = [path for path in files if path.suffix.lower() in ('.debug', '.pdb')
                        or '.dSYM/Contents/Resources/DWARF/' in path.as_posix()]
              if not metadata['symbols_validated'] or len(native) != 1:
                  raise SystemExit(f'Expected one verified native symbol file: {manifest}')
              output = Path('symbols/sentry-sources') / manifest.parent.name
              output.mkdir(parents=True, exist_ok=True)
              subprocess.run([os.environ['SENTRY_CLI_EXECUTABLE'], 'debug-files', 'bundle-sources',
                              str(native[0]), '--output', str(output)], check=True)
              if not list(output.glob('*.src.zip')):
                  raise SystemExit(f'No source context found for {native[0]}')
          PY
      - name: upload-private-debug-symbols
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-${{ matrix.name }}
          path: symbols/
          compression-level: 1
          retention-days: 90
          overwrite: true
          if-no-files-found: error
      # Configure each account separately: SENTRY_AUTH_TOKEN_GATEWAY / _DESKTOP
      # secrets, SENTRY_ORG_GATEWAY / _DESKTOP and SENTRY_PROJECT_GATEWAY / _DESKTOP
      # variables. Never fall back to the other product's account.
      - name: upload-to-sentry-if-configured
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets[startsWith(matrix.name, 'symbol-inputs-desktop-') && 'SENTRY_AUTH_TOKEN_DESKTOP' || 'SENTRY_AUTH_TOKEN_GATEWAY'] }}
          SENTRY_ORG: ${{ vars[startsWith(matrix.name, 'symbol-inputs-desktop-') && 'SENTRY_ORG_DESKTOP' || 'SENTRY_ORG_GATEWAY'] }}
          SENTRY_PROJECT: ${{ vars[startsWith(matrix.name, 'symbol-inputs-desktop-') && 'SENTRY_PROJECT_DESKTOP' || 'SENTRY_PROJECT_GATEWAY'] }}
        run: |
          set -euo pipefail
          if [[ -z "${SENTRY_AUTH_TOKEN:-}" || -z "${SENTRY_ORG:-}" || -z "${SENTRY_PROJECT:-}" ]]; then
            echo "Sentry upload is not configured; private symbols and source bundles were retained."
            exit 0
          fi
          python -c 'import os, subprocess; subprocess.run([os.environ["SENTRY_CLI_EXECUTABLE"], "debug-files", "upload", "symbols"], check=True)'
