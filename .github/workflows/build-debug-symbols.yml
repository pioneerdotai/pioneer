name: Build Debug Symbols

# Publication does not wait for this independent workflow. Never rebuild a
# release executable here: consume the original producer's link inputs.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact Release run that retained the inputs (legacy producers are also supported)
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      has_macos: ${{ steps.select.outputs.has_macos }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
    steps:
      - uses: actions/github-script@v8
        id: select
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const id = process.env.SOURCE_RUN_ID;
            if (!/^[0-9]+$/.test(id)) throw new Error('Invalid source run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: Number(id)});
            const {data: commit} = await github.rest.repos.getCommit({
              owner: context.repo.owner, repo: context.repo.repo, ref: context.ref});
            const producers = {'.github/workflows/release.yml': ['desktop', 'gateway'],
                               '.github/workflows/release-app.yml': ['desktop'],
                               '.github/workflows/release-gateway.yml': ['gateway']};
            const products = producers[run.path.split('@')[0]];
            if (run.head_repository.id !== context.payload.repository.id || run.head_sha !== commit.sha ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                !products) {
              throw new Error('Select the same ref/SHA as the trusted release producer');
            }
            core.setOutput('source_sha', run.head_sha);
            core.setOutput('source_run_id', String(run.id));
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100});
            const platforms = {
              'x86_64-unknown-linux-gnu': 'ubuntu-latest',
              'aarch64-unknown-linux-gnu': 'ubuntu-24.04-arm',
              'x86_64-apple-darwin': 'macos-latest',
              'aarch64-apple-darwin': 'macos-latest',
              'x86_64-pc-windows-msvc': 'windows-latest',
              'aarch64-pc-windows-msvc': 'windows-11-arm',
            };
            const include = [];
            for (const artifact of artifacts) {
              const match = /^symbol-inputs-(desktop|gateway)-(.+?)(?:-(default|computer-use))?$/.exec(artifact.name);
              if (!match || artifact.expired || !platforms[match[2]]) continue;
              if (!products.includes(match[1])) throw new Error('Unexpected input producer');
              include.push({artifact_id: artifact.id, name: artifact.name,
                            target: match[2], os: platforms[match[2]]});
            }
            core.setOutput('matrix', JSON.stringify({include}));
            core.setOutput('count', include.length);
            core.setOutput('has_macos', include.some(row => row.os.startsWith('macos')));
            const expected = Object.keys(platforms).flatMap(target => products.flatMap(product => product === 'desktop'
              ? [`symbol-inputs-desktop-${target}`]
              : ['default', 'computer-use'].map(feature => `symbol-inputs-gateway-${target}-${feature}`)));
            const names = new Set(include.map(row => row.name));
            if (expected.some(name => !names.has(name))) throw new Error('Missing release symbol inputs');

  macos-tool:
    needs: inputs
    if: needs.inputs.outputs.has_macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.inputs.outputs.source_sha }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pioneer-dsymutil
          key: dsymutil-${{ runner.os }}-${{ runner.arch }}-5e8490a1-${{ hashFiles('scripts/packaging/dsymutil-undefined-symbols.patch') }}
      - name: build-pinned-dsymutil
        shell: bash
        run: python3 scripts/packaging/run-symbol-job.py bash scripts/packaging/build-dsymutil.sh "$RUNNER_TEMP/pioneer-dsymutil"
      - uses: actions/upload-artifact@v6
        with:
          name: debug-symbols-macos-tool
          path: ${{ runner.temp }}/pioneer-dsymutil/
          retention-days: 7
          if-no-files-found: error

  symbols:
    name: symbols-${{ matrix.name }}
    needs: [inputs, macos-tool]
    if: >-
      always() && needs.inputs.result == 'success' && needs.inputs.outputs.count != '0'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inputs.outputs.matrix) }}
    env:
      SYMBOL_SOURCE_SHA: ${{ needs.inputs.outputs.source_sha }}
      SYMBOL_SOURCE_RUN_ID: ${{ needs.inputs.outputs.source_run_id }}
      SYMBOL_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.inputs.outputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: download-exact-release-inputs
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ matrix.artifact_id }}
          run-id: ${{ needs.inputs.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: symbol-inputs
          merge-multiple: true
      - name: download-pinned-dsymutil
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v7
        with:
          name: debug-symbols-macos-tool
          path: symbol-tool
      - name: generate-and-verify-debug-symbols
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            chmod +x symbol-tool/dsymutil
            export DSYMUTIL="$PWD/symbol-tool/dsymutil"
          fi
          python scripts/packaging/run-symbol-job.py python scripts/packaging/symbol-inputs.py process symbol-inputs symbol-work symbols
          if [[ -f symbol-tool/tool.json ]]; then cp symbol-tool/tool.json symbols/dsymutil-tool.json; fi
      - name: upload-private-debug-symbols
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-${{ matrix.name }}
          path: symbols/
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
