name: Release Gateway

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  # wait-for-ci:
  #   name: wait-for-ci
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 155
  #   steps:
  #     - uses: actions/checkout@v5
