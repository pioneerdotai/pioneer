  #     - name: wait-for-successful-exact-sha-ci
  #       env:
  #         CI_WAIT_REPOSITORY: ${{ github.repository }}
  #         CI_WAIT_SHA: ${{ github.sha }}
  #         GITHUB_TOKEN: ${{ github.token }}
  #       run: >-
  #         python3 scripts/ci/wait_for_ci.py
  #         --repository "$CI_WAIT_REPOSITORY"
  #         --workflow ci.yml
  #         --sha "$CI_WAIT_SHA"
