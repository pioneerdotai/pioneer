  build-gateway:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PIONEER_SENTRY_DSN: ${{ secrets.PIONEER_SENTRY_DSN }}
      PIONEER_SENTRY_ENVIRONMENT: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: pioneer-gateway-linux-x86_64.gz
            archive: gz
            cargo_features: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: pioneer-gateway-linux-x86_64-computer-use.gz
            archive: gz
            cargo_features: computer-use
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: pioneer-gateway-linux-aarch64.gz
            archive: gz
            cargo_features: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: pioneer-gateway-linux-aarch64-computer-use.gz
            archive: gz
            cargo_features: computer-use
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: pioneer-gateway-macos-aarch64.gz
            archive: gz
            cargo_features: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: pioneer-gateway-macos-aarch64-computer-use.gz
            archive: gz
            cargo_features: computer-use
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: pioneer-gateway-macos-x86_64.zip
            archive: zip
            cargo_features: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: pioneer-gateway-macos-x86_64-computer-use.zip
            archive: zip
            cargo_features: computer-use
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: pioneer-gateway-windows-x86_64.zip
            archive: zip
            cargo_features: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: pioneer-gateway-windows-x86_64-computer-use.zip
            archive: zip
            cargo_features: computer-use
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_name: pioneer-gateway-windows-aarch64.zip
            archive: zip
            cargo_features: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_name: pioneer-gateway-windows-aarch64-computer-use.zip
            archive: zip
            cargo_features: computer-use

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: setup-zig-for-linux-aarch64
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu' && runner.arch != 'ARM64'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: install-linux-build-dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            pkg-config
            libssl-dev
          )
          if [[ -n "${{ matrix.cargo_features }}" ]]; then
            packages+=(
              libegl1-mesa-dev
              libgbm-dev
              libpipewire-0.3-dev
              libwayland-dev
              libxkbcommon-dev
            )
          fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
          if [[ -n "${{ matrix.cargo_features }}" ]]; then
            multiarch="$(gcc -print-multiarch)"
            echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/${multiarch}" >> "${GITHUB_ENV}"
          fi

      - name: install-onnx-runtime-macos-x86_64
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          ORT_VERSION="1.24.2"
          ORT_ARCHIVE="$RUNNER_TEMP/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          ORT_DIR="$RUNNER_TEMP/onnxruntime-osx-x86_64-${ORT_VERSION}"
          curl -fL --retry 3 --retry-delay 1 \
            -o "$ORT_ARCHIVE" \
            "https://blob.handy.computer/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          tar -xzf "$ORT_ARCHIVE" -C "$RUNNER_TEMP"
          test -d "$ORT_DIR/lib"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo "PIONEER_ONNXRUNTIME_DYLIB_DIR=$ORT_DIR/lib" >> "$GITHUB_ENV"
          existing_rustflags="${RUSTFLAGS:-}"
          echo "RUSTFLAGS=${existing_rustflags:+$existing_rustflags }-C link-arg=-Wl,-rpath,@executable_path" >> "$GITHUB_ENV"

      - name: build-unix-target
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" && "${RUNNER_ARCH:-}" != "ARM64" ]]; then
            cargo install cargo-zigbuild --locked --quiet
            if [[ -n "${{ matrix.cargo_features }}" ]]; then
              cargo zigbuild --locked --release -p pioneer-cli --features "${{ matrix.cargo_features }}" --target "${{ matrix.target }}"
            else
              cargo zigbuild --locked --release -p pioneer-cli --target "${{ matrix.target }}"
            fi
          else
            if [[ -n "${{ matrix.cargo_features }}" ]]; then
              cargo build --locked --release -p pioneer-cli --features "${{ matrix.cargo_features }}" --target "${{ matrix.target }}"
            else
              cargo build --locked --release -p pioneer-cli --target "${{ matrix.target }}"
            fi
          fi

      - name: build-windows-target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $env:BINDGEN_EXTRA_CLANG_ARGS = "--target=$target"

          if ($target -eq "aarch64-pc-windows-msvc") {
            # ggml's ARM backend requires clang. Ninja lets CMake honor the
            # compiler selection instead of forcing the Visual Studio toolset.
            $env:CMAKE_GENERATOR = "Ninja"
            $env:CMAKE_C_COMPILER = "clang-cl"
            $env:CMAKE_CXX_COMPILER = "clang-cl"
            $env:CMAKE_C_COMPILER_TARGET = $target
            $env:CMAKE_CXX_COMPILER_TARGET = $target
            $env:CL = "/EHsc"
            # ccache exited successfully without producing clang-cl ARM64
            # object files in release builds, so invoke the compiler directly.
            $env:GGML_CCACHE = "OFF"
          }

          $cargoArgs = @("build", "--locked", "--release", "-p", "pioneer-cli")
          if (-not [string]::IsNullOrWhiteSpace("${{ matrix.cargo_features }}")) {
            $cargoArgs += @("--features", "${{ matrix.cargo_features }}")
          }
          $cargoArgs += @("--target", $target)
          cargo @cargoArgs

      - name: package-unix-artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary_path="target/${{ matrix.target }}/release/pioneer"
          cp "$binary_path" pioneer
          chmod 0755 pioneer
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            if [[ -z "${PIONEER_ONNXRUNTIME_DYLIB_DIR:-}" ]]; then
              echo "PIONEER_ONNXRUNTIME_DYLIB_DIR is required for zip gateway artifacts" >&2
              exit 1
            fi
            shopt -s nullglob
            dylibs=("$PIONEER_ONNXRUNTIME_DYLIB_DIR"/libonnxruntime*.dylib)
            if [[ ${#dylibs[@]} -eq 0 ]]; then
              echo "no libonnxruntime dylibs found in $PIONEER_ONNXRUNTIME_DYLIB_DIR" >&2
              exit 1
            fi
            for dylib in "${dylibs[@]}"; do
              cp -L "$dylib" .
            done
            zip -9 "${{ matrix.asset_name }}" pioneer libonnxruntime*.dylib
          else
            gzip -9 pioneer
            mv pioneer.gz "${{ matrix.asset_name }}"
          fi

      - name: package-windows-artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binaryPath = "target/${{ matrix.target }}/release/pioneer.exe"
          Copy-Item -Path $binaryPath -Destination "pioneer.exe" -Force
          Compress-Archive -Path "pioneer.exe" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: upload-asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: [wait-for-ci, build-gateway]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: download-artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: assemble-release-assets
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          cd dist
          rm -f SHA256SUMS
          shopt -s nullglob
          files=(pioneer-gateway-*.gz pioneer-gateway-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no gateway artifacts found for checksum generation"
            exit 1
          fi
          for file in "${files[@]}"; do
            sha="$(sha256sum "$file" | awk '{print $1}')"
            printf 'sha256:%s %s\n' "$sha" "$file" >> SHA256SUMS
          done
          sort -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: publish-github-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/pioneer-gateway-*.gz dist/pioneer-gateway-*.zip dist/SHA256SUMS)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no gateway release assets found in dist/"
            exit 1
          fi

          prerelease_flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" ${prerelease_flag} || true

          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
