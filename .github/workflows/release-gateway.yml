name: Release Gateway
run-name: Release Gateway (${{ github.ref_name }})

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: keep-release-hidden-until-gateway-assets-are-ready
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          prerelease_flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft ${prerelease_flag}
          else
            if ! gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --draft ${prerelease_flag}; then
              # The app workflow may have created the same release concurrently.
              gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
                --draft ${prerelease_flag}
            fi
          fi

  generate-model-catalog:
    name: generate-model-catalog
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-model-catalog-v1

      - name: generate-and-validate-model-catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-model-catalog
          cargo run --locked --release -p pioneer-provider --bin pioneer-model-catalog -- \
            release-model-catalog/catalog.json

      - name: upload-model-catalog
        uses: actions/upload-artifact@v6
        with:
          name: pioneer-release-model-catalog
          path: release-model-catalog/catalog.json
          if-no-files-found: error

  build-gateway:
    name: gateway-${{ matrix.target }}-default-and-computer-use
    needs: generate-model-catalog
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PIONEER_SENTRY_DSN: ${{ secrets.PIONEER_SENTRY_DSN }}
      PIONEER_SENTRY_ENVIRONMENT: production
      # Exact release inputs only; ordinary CI/local release profiles stay unchanged.
      CARGO_PROFILE_RELEASE_DEBUG: "2"
      CARGO_PROFILE_RELEASE_STRIP: "none"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple-darwin') && 'unpacked' || 'off' }}
      PIONEER_BUNDLED_MODEL_CATALOG: ${{ github.workspace }}/release-model-catalog/catalog.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: pioneer-gateway-linux-x86_64.gz, computer_asset: pioneer-gateway-linux-x86_64-computer-use.gz}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: pioneer-gateway-linux-aarch64.gz, computer_asset: pioneer-gateway-linux-aarch64-computer-use.gz}
          - {os: macos-latest, target: aarch64-apple-darwin, asset: pioneer-gateway-macos-aarch64.gz, computer_asset: pioneer-gateway-macos-aarch64-computer-use.gz}
          - {os: macos-latest, target: x86_64-apple-darwin, asset: pioneer-gateway-macos-x86_64.zip, computer_asset: pioneer-gateway-macos-x86_64-computer-use.zip}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, asset: pioneer-gateway-windows-x86_64.zip, computer_asset: pioneer-gateway-windows-x86_64-computer-use.zip}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc, asset: pioneer-gateway-windows-aarch64.zip, computer_asset: pioneer-gateway-windows-aarch64-computer-use.zip}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: download-model-catalog
        uses: actions/download-artifact@v7
        with:
          name: pioneer-release-model-catalog
          path: release-model-catalog
      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: configure-native-release-environment
        shell: bash
        run: python scripts/packaging/build-gateway.py --target "${{ matrix.target }}" --configure
      - name: install-linux-build-dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            pkg-config
            libssl-dev
            libegl1-mesa-dev
            libgbm-dev
            libpipewire-0.3-dev
            libwayland-dev
            libxkbcommon-dev
          )
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
          multiarch="$(gcc -print-multiarch)"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/${multiarch}" >> "${GITHUB_ENV}"
      - name: install-onnx-runtime-macos-x86_64
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          ORT_VERSION="1.24.2"
          ORT_ARCHIVE="$RUNNER_TEMP/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          ORT_DIR="$RUNNER_TEMP/onnxruntime-osx-x86_64-${ORT_VERSION}"
          curl -fL --retry 3 --retry-delay 1 \
            -o "$ORT_ARCHIVE" \
            "https://blob.handy.computer/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          tar -xzf "$ORT_ARCHIVE" -C "$RUNNER_TEMP"
          test -d "$ORT_DIR/lib"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo "PIONEER_ONNXRUNTIME_DYLIB_DIR=$ORT_DIR/lib" >> "$GITHUB_ENV"
          existing_rustflags="${RUSTFLAGS:-}"
          echo "RUSTFLAGS=${existing_rustflags:+$existing_rustflags }-C link-arg=-Wl,-rpath,@executable_path" >> "$GITHUB_ENV"

      - name: restore-release-dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-gateway-${{ matrix.target }}-v1
          cache-workspace-crates: false

      - name: build-default
        shell: bash
        run: |
          set -euo pipefail
          python scripts/packaging/build-gateway.py --target "${{ matrix.target }}" \
            --variant default --asset "${{ matrix.asset }}" \
            --out release-gateway/default
      - name: retain-default-symbol-inputs
        uses: actions/upload-artifact@v6
        with:
          name: symbol-inputs-gateway-${{ matrix.target }}-default
          path: release-gateway/default/symbol-inputs/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: retain-default-release-asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: release-gateway/default/assets/
          if-no-files-found: error
      - name: remove-uploaded-default-transfer-copy
        shell: bash
        run: python -c 'import shutil; shutil.rmtree("release-gateway/default")'

      - name: build-computer-use
        shell: bash
        run: |
          set -euo pipefail
          python scripts/packaging/build-gateway.py --target "${{ matrix.target }}" \
            --variant computer-use --asset "${{ matrix.computer_asset }}" \
            --out release-gateway/computer-use
      - name: retain-computer-use-symbol-inputs
        uses: actions/upload-artifact@v6
        with:
          name: symbol-inputs-gateway-${{ matrix.target }}-computer-use
          path: release-gateway/computer-use/symbol-inputs/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: retain-computer-use-release-asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.computer_asset }}
          path: release-gateway/computer-use/assets/
          if-no-files-found: error
      - name: remove-uploaded-computer-use-transfer-copy
        shell: bash
        run: python -c 'import shutil; shutil.rmtree("release-gateway/computer-use")'

  publish-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: publish-release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-gateway]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: download-artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: pioneer-gateway-*
          merge-multiple: true

      - name: assemble-release-assets
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          cd dist
          rm -f SHA256SUMS
          shopt -s nullglob
          files=(pioneer-gateway-*.gz pioneer-gateway-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no gateway artifacts found for checksum generation"
            exit 1
          fi
          for file in "${files[@]}"; do
            sha="$(sha256sum "$file" | awk '{print $1}')"
            printf 'sha256:%s %s\n' "$sha" "$file" >> SHA256SUMS
          done
          sort -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: publish-github-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/pioneer-gateway-*.gz dist/pioneer-gateway-*.zip dist/SHA256SUMS)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no gateway release assets found in dist/"
            exit 1
          fi

          prerelease_flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber

          if [[ -n "${prerelease_flag}" ]]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
          else
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease=false --latest
          fi

  queue-debug-symbols:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: queue-independent-debug-symbols
    needs: build-gateway
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'build-debug-symbols.yml',
              ref: context.ref.replace(/^refs\/(heads|tags)\//, ''),
              inputs: {source_run_id: String(context.runId)},
            });
