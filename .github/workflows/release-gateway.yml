name: Release Gateway

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-gateway:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: pioneer-gateway-linux-x86_64.gz
            archive: gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: pioneer-gateway-linux-aarch64.gz
            archive: gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: pioneer-gateway-macos-aarch64.gz
            archive: gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: pioneer-gateway-macos-x86_64.gz
            archive: gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: pioneer-gateway-windows-x86_64.zip
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_name: pioneer-gateway-windows-aarch64.zip
            archive: zip

    steps:
      - uses: actions/checkout@v5

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: setup-zig-for-linux-aarch64
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: build-unix-target
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            cargo install cargo-zigbuild --locked --quiet
            cargo zigbuild --release -p pioneer-cli --target "${{ matrix.target }}"
          else
            cargo build --release -p pioneer-cli --target "${{ matrix.target }}"
          fi

      - name: build-windows-target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p pioneer-cli --target "${{ matrix.target }}"

      - name: package-unix-artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary_path="target/${{ matrix.target }}/release/pioneer"
          cp "$binary_path" pioneer
          chmod 0755 pioneer
          gzip -9 pioneer
          mv pioneer.gz "${{ matrix.asset_name }}"

      - name: package-windows-artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binaryPath = "target/${{ matrix.target }}/release/pioneer.exe"
          Copy-Item -Path $binaryPath -Destination "pioneer.exe" -Force
          Compress-Archive -Path "pioneer.exe" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: upload-asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build-gateway
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v5

      - name: download-artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: assemble-release-assets
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          cd dist
          rm -f SHA256SUMS
          shopt -s nullglob
          files=(pioneer-gateway-*.gz pioneer-gateway-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no gateway artifacts found for checksum generation"
            exit 1
          fi
          for file in "${files[@]}"; do
            sha="$(sha256sum "$file" | awk '{print $1}')"
            printf 'sha256:%s %s\n' "$sha" "$file" >> SHA256SUMS
          done
          sort -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: publish-github-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/pioneer-gateway-*.gz dist/pioneer-gateway-*.zip dist/SHA256SUMS)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no gateway release assets found in dist/"
            exit 1
          fi

          prerelease_flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" ${prerelease_flag} || true

          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
