name: Update CUA driver

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Published CUA driver tag (empty selects the latest, including nightlies)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-cua-driver
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CUA_UPDATE_TOKEN: ${{ secrets.CUA_UPDATE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.CUA_UPDATE_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update the complete CUA dependency
        env:
          GH_TOKEN: ${{ github.token }}
          CUA_RELEASE: ${{ inputs.release }}
        run: |
          if [[ -n "$CUA_RELEASE" ]]; then
            python3 scripts/update-cua-driver.py --release "$CUA_RELEASE"
          else
            python3 scripts/update-cua-driver.py
          fi
          python3 scripts/update-cua-driver.py --check
          cargo fmt --all --check
          git diff --check

      - name: Propose the update
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CUA_UPDATE_TOKEN || github.token }}
          branch: automation/update-cua-driver
          delete-branch: true
          commit-message: "Update CUA SDK, driver and schemas to the latest release"
          title: "Update CUA SDK, driver and schemas"
          body: |
            Updates the Gateway's SDK, packaged driver, release identity and passive
            native/browser schemas together from the latest published trycua/cua
            driver release, including nightlies. Gateway ownership, explicit tool
            allowlists and package provenance checks remain enforced.

            Dependency resolution and formatting run in the update job. The normal
            CI workflow is dispatched separately so GITHUB_TOKEN-created PRs do
            not depend on approval of pull_request workflow runs. Merge only after
            that CI passes.
          add-paths: |
            config/cua-driver.json
            crates/protocol/src/cua_driver_release.rs
            crates/gateway/Cargo.toml
            crates/tools/src/handlers/computer_use/native-contract.json
            crates/tools/src/handlers/computer_use/browser_catalog.rs
            Cargo.lock

      - name: Run CI for the proposed revision
        if: env.HAS_CUA_UPDATE_TOKEN != 'true' && (steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref automation/update-cua-driver
